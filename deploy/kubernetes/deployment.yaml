apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-open-discogs-api
  namespace: open-discogs
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: go-open-discogs-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: go-open-discogs-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: "/metrics"
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: ghcr.io/dsub-io/go-open-discogs-api:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: go-open-discogs-api
            - secretRef:
                name: go-open-discogs-api
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 8081
          startupProbe:
            httpGet:
              path: /readyz
              port: management
            failureThreshold: 30
            periodSeconds: 2
            timeoutSeconds: 1
          readinessProbe:
            httpGet:
              path: /readyz
              port: management
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: management
            periodSeconds: 30
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "2"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
