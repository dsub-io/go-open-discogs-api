name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  packages: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      prs-created: ${{ steps.release.outputs.prs_created }}
      pr: ${{ steps.release.outputs.pr }}
      release-created: ${{ steps.release.outputs.release_created }}
      tag-name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Create or update release
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.GH_TOKEN }}

  sign-release-pr:
    needs: release-please
    if: ${{ needs.release-please.outputs.prs-created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
          token: ${{ secrets.GH_TOKEN }}
      - name: Import commit signing key
        shell: bash
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$GPG_PRIVATE_KEY" ]]; then
            echo "::error::Missing GitHub Actions secret: GPG_PRIVATE_KEY"
            exit 1
          fi
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          install -d -m 700 "$GNUPGHOME"
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
      - name: Sign Release Please commit
        shell: bash
        env:
          EXPECTED_BASE_BRANCH: ${{ fromJSON(needs.release-please.outputs.pr).baseBranchName }}
          RELEASE_PR_BRANCH: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
        run: |
          set -euo pipefail
          if [[ "$EXPECTED_BASE_BRANCH" != "main" ]]; then
            echo "::error::Release Please pull request does not target main."
            exit 1
          fi
          if [[ ! "$RELEASE_PR_BRANCH" =~ ^release-please--branches--main--components--[A-Za-z0-9._-]+$ ]]; then
            echo "::error::Unexpected Release Please branch."
            exit 1
          fi
          expected_head_sha="$(git rev-parse "refs/remotes/origin/$RELEASE_PR_BRANCH")"
          if [[ "$(git rev-parse HEAD)" != "$expected_head_sha" ]]; then
            echo "::error::Checked-out commit does not match Release Please output."
            exit 1
          fi
          signing_key="$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1 == "fpr" {print $10; exit}')"
          if [[ -z "$signing_key" ]]; then
            echo "::error::No GPG secret key is available for commit signing."
            exit 1
          fi
          git config user.name state303
          git config user.email state303@dsub.io
          git config user.signingkey "$signing_key"
          git commit --amend --no-edit --gpg-sign="$signing_key"
          git verify-commit HEAD
          git push --force-with-lease="refs/heads/$RELEASE_PR_BRANCH:$expected_head_sha" origin "HEAD:refs/heads/$RELEASE_PR_BRANCH"

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release-created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
      id-token: write
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: discogs
          POSTGRES_PASSWORD: discogs
          POSTGRES_DB: discogs
        ports:
          - 5432:5432
        options: >-
          --tmpfs /var/lib/postgresql:rw,noexec,nosuid,size=1g
          --health-cmd "pg_isready --username discogs --dbname discogs"
          --health-interval 1s
          --health-timeout 5s
          --health-retries 30
    env:
      IMAGE_REPOSITORY: ghcr.io/echovisionlab/go-open-discogs-api
      TEST_DATABASE_URL: postgres://discogs:discogs@127.0.0.1:5432/discogs?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.release-please.outputs.sha }}
      - name: Validate Release Please output
        shell: bash
        env:
          RELEASE_SHA: ${{ needs.release-please.outputs.sha }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag-name }}
          RELEASE_VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release Please returned an invalid semantic version."
            exit 1
          fi
          if [[ "$RELEASE_TAG" != "v$RELEASE_VERSION" ]]; then
            echo "::error::Release tag does not match the release version."
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" != "$RELEASE_SHA" ]]; then
            echo "::error::Checked-out commit does not match the release."
            exit 1
          fi
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Test release source
        run: go test -count=1 ./...
      - name: Publish release binaries
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          distribution: goreleaser
          version: v2.18.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Publish multi-architecture container
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          sbom: true
          build-args: VERSION=${{ needs.release-please.outputs.version }}
          tags: |
            ghcr.io/echovisionlab/go-open-discogs-api:${{ needs.release-please.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/echovisionlab/go-open-discogs-api
            org.opencontainers.image.revision=${{ needs.release-please.outputs.sha }}
            org.opencontainers.image.version=${{ needs.release-please.outputs.version }}
            org.opencontainers.image.licenses=MIT
      - name: Verify versioned image
        shell: bash
        env:
          EXPECTED_IMAGE_LICENSES: MIT
          EXPECTED_IMAGE_SOURCE: https://github.com/echovisionlab/go-open-discogs-api
          EXPECTED_IMAGE_USER: 65532:65532
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          RELEASE_SHA: ${{ needs.release-please.outputs.sha }}
          RELEASE_VERSION: ${{ needs.release-please.outputs.version }}
          VERSIONED_IMAGE: ghcr.io/echovisionlab/go-open-discogs-api:${{ needs.release-please.outputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Buildx returned an invalid image digest."
            exit 1
          fi

          manifest="$(
            docker buildx imagetools inspect \
              --format '{{json .Manifest}}' \
              "$VERSIONED_IMAGE"
          )"
          published_digest="$(jq -er '.digest' <<<"$manifest")"
          if [[ "$published_digest" != "$IMAGE_DIGEST" ]]; then
            echo "::error::Versioned image tag does not resolve to the Buildx digest."
            exit 1
          fi
          jq -e '
            def target_platform:
              .platform.os == "linux" and
              (.platform.architecture == "amd64" or .platform.architecture == "arm64");
            def attestation:
              (.annotations["vnd.docker.reference.type"] // "") == "attestation-manifest" and
              .platform.os == "unknown" and
              .platform.architecture == "unknown";
            all(.manifests[]; target_platform or attestation) and
            ([
              .manifests[]
              | select(target_platform)
              | (.platform.os + "/" + .platform.architecture)
            ] | sort) == ["linux/amd64", "linux/arm64"]
          ' <<<"$manifest" >/dev/null

          verify_platform_image() {
            local platform="$1"
            local platform_digest="$2"
            local platform_image="${IMAGE_REPOSITORY}@${platform_digest}"
            local image_licenses
            local image_revision
            local image_source
            local image_user
            local image_version
            local reported_version

            docker pull --platform "$platform" "$platform_image"

            image_user="$(
              docker image inspect "$platform_image" --format '{{.Config.User}}'
            )"
            if [[ "$image_user" != "$EXPECTED_IMAGE_USER" ]]; then
              echo "::error::$platform image user is $image_user, expected $EXPECTED_IMAGE_USER."
              return 1
            fi

            image_source="$(
              docker image inspect "$platform_image" \
                --format '{{ index .Config.Labels "org.opencontainers.image.source" }}'
            )"
            image_revision="$(
              docker image inspect "$platform_image" \
                --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}'
            )"
            image_version="$(
              docker image inspect "$platform_image" \
                --format '{{ index .Config.Labels "org.opencontainers.image.version" }}'
            )"
            image_licenses="$(
              docker image inspect "$platform_image" \
                --format '{{ index .Config.Labels "org.opencontainers.image.licenses" }}'
            )"
            if [[ "$image_source" != "$EXPECTED_IMAGE_SOURCE" ||
              "$image_revision" != "$RELEASE_SHA" ||
              "$image_version" != "$RELEASE_VERSION" ||
              "$image_licenses" != "$EXPECTED_IMAGE_LICENSES" ]]; then
              echo "::error::$platform image OCI labels do not match the release."
              return 1
            fi

            reported_version="$(
              docker run --rm --network none --read-only \
                --platform "$platform" \
                "$platform_image" --version
            )"
            if [[ "$reported_version" != "$RELEASE_VERSION" ]]; then
              echo "::error::$platform image reports unexpected version: $reported_version"
              return 1
            fi
          }

          while IFS=$'\t' read -r platform platform_digest; do
            verify_platform_image "$platform" "$platform_digest"
          done < <(
            jq -r '
              .manifests[]
              | select(
                  .platform.os == "linux" and
                  (.platform.architecture == "amd64" or
                   .platform.architecture == "arm64")
                )
              | [(.platform.os + "/" + .platform.architecture), .digest]
              | @tsv
            ' <<<"$manifest"
          )

      - name: Promote validated image to latest
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          immutable_image="${IMAGE_REPOSITORY}@${IMAGE_DIGEST}"
          latest_image="${IMAGE_REPOSITORY}:latest"

          docker buildx imagetools create \
            --tag "$latest_image" \
            "$immutable_image"

          latest_manifest="$(
            docker buildx imagetools inspect \
              --format '{{json .Manifest}}' \
              "$latest_image"
          )"
          latest_digest="$(jq -er '.digest' <<<"$latest_manifest")"
          if [[ "$latest_digest" != "$IMAGE_DIGEST" ]]; then
            echo "::error::Latest image does not resolve to the validated digest."
            exit 1
          fi
