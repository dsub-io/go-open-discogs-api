name: CI

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - edited
  push:
    branches:
      - main
  schedule:
    - cron: '41 2 * * 4'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TEST_DATABASE_URL: postgres://discogs:discogs@127.0.0.1:5432/discogs?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changes
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          change_range=
          case "$EVENT_NAME" in
            pull_request)
              change_range="$PR_BASE_SHA..$PR_HEAD_SHA"
              ;;
            push)
              if [[ "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]] &&
                git cat-file -e "$PUSH_BEFORE_SHA^{commit}" 2>/dev/null; then
                change_range="$PUSH_BEFORE_SHA..$PUSH_HEAD_SHA"
              fi
              ;;
          esac

          heavy=true
          if [[ -n "$change_range" ]]; then
            mapfile -t changed_files < <(git diff --name-only "$change_range")
            if (( ${#changed_files[@]} > 0 )); then
              heavy=false
              for changed_file in "${changed_files[@]}"; do
                case "$changed_file" in
                  README.md|CHANGELOG.md|LICENSE|NOTICE|docs/*|.github/ISSUE_TEMPLATE/*|.github/PULL_REQUEST_TEMPLATE.md)
                    ;;
                  *)
                    heavy=true
                    break
                    ;;
                esac
              done
            fi
            git diff --check "$change_range"
          fi

          echo "heavy=$heavy" >> "$GITHUB_OUTPUT"
          echo "range=$change_range" >> "$GITHUB_OUTPUT"

      - name: Validate Conventional Commits
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_HEAD_REF: ${{ github.head_ref }}
          CHANGE_RANGE: ${{ steps.changes.outputs.range }}
        run: |
          set -euo pipefail

          pattern='^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([a-z0-9._/-]+\))?(!)?: .+'
          branch_pattern='^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)/[a-z0-9._/-]+$'

          validate_subject() {
            local label="$1"
            local subject="$2"
            if [[ ! "$subject" =~ $pattern ]]; then
              echo "::error::$label is not a Conventional Commit: $subject"
              return 1
            fi
          }

          failed=0
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            validate_subject "Pull request title" "$PR_TITLE" || failed=1
            normalized_head_ref="${PR_HEAD_REF,,}"
            if [[ ! "$normalized_head_ref" =~ $branch_pattern ]] &&
              [[ ! "$normalized_head_ref" =~ ^dependabot/ ]] &&
              [[ ! "$normalized_head_ref" =~ ^release-please-- ]]; then
              echo "::error::Pull request branch is not Conventional: $PR_HEAD_REF"
              failed=1
            fi
          fi

          range="${CHANGE_RANGE:-HEAD^..HEAD}"
          while IFS= read -r subject; do
            [[ -z "$subject" ]] && continue
            validate_subject "Commit subject" "$subject" || failed=1
          done < <(git log --no-merges --format=%s "$range")

          exit "$failed"

      - name: Set up Go
        if: steps.changes.outputs.heavy == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Verify formatting
        if: steps.changes.outputs.heavy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            printf 'The following files need gofmt:\n%s\n' "$unformatted"
            exit 1
          fi

      - name: Verify module metadata
        if: steps.changes.outputs.heavy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Verify ambiguous Go types are absent
        if: steps.changes.outputs.heavy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if rg -n '\bany\b|interface\{\}|map\[string\]any' --glob '*.go' .; then
            exit 1
          fi

      - name: Start PostgreSQL
        if: steps.changes.outputs.heavy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --rm \
            --name open-discogs-ci-postgres \
            --publish 5432:5432 \
            --env POSTGRES_USER=discogs \
            --env POSTGRES_PASSWORD=discogs \
            --env POSTGRES_DB=discogs \
            --tmpfs /var/lib/postgresql:rw,noexec,nosuid,size=1g \
            --health-cmd 'pg_isready --username discogs --dbname discogs' \
            --health-interval 1s \
            --health-timeout 5s \
            --health-retries 30 \
            postgres:18-alpine
          for _ in {1..30}; do
            if [[ "$(docker inspect --format '{{.State.Health.Status}}' open-discogs-ci-postgres)" == healthy ]]; then
              exit 0
            fi
            sleep 1
          done
          docker logs open-discogs-ci-postgres
          exit 1

      - name: Vet packages
        if: steps.changes.outputs.heavy == 'true'
        run: go vet ./...

      - name: Test with race detector and coverage
        if: steps.changes.outputs.heavy == 'true'
        run: go test -race -count=1 -coverpkg=./... -covermode=atomic -coverprofile=coverage.out ./...

      - name: Enforce 100% coverage
        if: steps.changes.outputs.heavy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          total="$(go tool cover -func=coverage.out | awk '/^total:/ {gsub("%", "", $3); print $3}')"
          awk -v total="$total" 'BEGIN {
            if (total + 0 != 100.0) {
              printf "coverage %.1f%% does not meet the 100%% gate\n", total
              exit 1
            }
            printf "coverage %.1f%% meets the 100%% gate\n", total
          }'

      - name: Scan known vulnerabilities
        if: steps.changes.outputs.heavy == 'true'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

      - name: Initialize CodeQL
        if: steps.changes.outputs.heavy == 'true'
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: go
          build-mode: manual

      - name: Build packages for CodeQL
        if: steps.changes.outputs.heavy == 'true'
        run: |
          go clean -cache
          go build ./...

      - name: Analyze with CodeQL
        if: steps.changes.outputs.heavy == 'true'
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          category: /language:go

      - name: Validate Docker Compose
        if: steps.changes.outputs.heavy == 'true'
        env:
          API_DATABASE_URL: postgres://reader:secret@database:5432/discogs?sslmode=require
        run: docker compose config --quiet

      - name: Render Kubernetes manifests
        if: steps.changes.outputs.heavy == 'true'
        run: go run sigs.k8s.io/kustomize/kustomize/v5@v5.8.1 build deploy/kubernetes >/dev/null

      - name: Build container
        if: steps.changes.outputs.heavy == 'true'
        run: docker build --build-arg VERSION=ci -t go-open-discogs-api:ci .

      - name: Test container readiness
        if: steps.changes.outputs.heavy == 'true'
        run: scripts/test-container-readiness.sh go-open-discogs-api:ci

      - name: Stop PostgreSQL
        if: always() && steps.changes.outputs.heavy == 'true'
        run: docker rm --force open-discogs-ci-postgres >/dev/null 2>&1 || true
