name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test, race, and 100% coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: discogs
          POSTGRES_PASSWORD: discogs
          POSTGRES_DB: discogs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username discogs --dbname discogs"
          --health-interval 1s
          --health-timeout 5s
          --health-retries 30
          --tmpfs /var/lib/postgresql:rw,noexec,nosuid,size=1g
    env:
      TEST_DATABASE_URL: postgres://discogs:discogs@127.0.0.1:5432/discogs?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify formatting
        shell: bash
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            printf 'The following files need gofmt:\n%s\n' "$unformatted"
            exit 1
          fi

      - name: Verify module metadata
        shell: bash
        run: |
          set -euo pipefail
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Verify ambiguous Go types are absent
        shell: bash
        run: |
          set -euo pipefail
          if rg -n '\bany\b|interface\{\}|map\[string\]any' --glob '*.go' .; then
            exit 1
          fi

      - name: Vet packages
        run: go vet ./...

      - name: Test with race detector and coverage
        run: go test -race -count=1 -coverpkg=./... -covermode=atomic -coverprofile=coverage.out ./...

      - name: Enforce 100% coverage
        shell: bash
        run: |
          set -euo pipefail
          total="$(go tool cover -func=coverage.out | awk '/^total:/ {gsub("%", "", $3); print $3}')"
          awk -v total="$total" 'BEGIN {
            if (total + 0 != 100.0) {
              printf "coverage %.1f%% does not meet the 100%% gate\n", total
              exit 1
            }
            printf "coverage %.1f%% meets the 100%% gate\n", total
          }'

      - name: Scan known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

  packaging:
    name: Validate deployment artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate Docker Compose
        env:
          API_DATABASE_URL: postgres://reader:secret@database:5432/discogs?sslmode=require
        run: docker compose config --quiet
      - name: Render Kubernetes manifests
        run: go run sigs.k8s.io/kustomize/kustomize/v5@v5.8.1 build deploy/kubernetes >/dev/null
      - name: Build container
        run: docker build --build-arg VERSION=ci -t go-open-discogs-api:ci .
      - name: Test container readiness
        run: scripts/test-container-readiness.sh go-open-discogs-api:ci
