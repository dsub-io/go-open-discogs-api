name: CI

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - edited
  schedule:
    - cron: '41 2 * * 4'
  merge_group:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event.action == 'edited' && !github.event.changes.base && 'metadata' || 'verification' }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ github.event.action == 'edited' && !github.event.changes.base && 'PR metadata' || 'Verify' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TEST_DATABASE_URL: postgres://discogs:discogs@127.0.0.1:5432/discogs?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changes
        id: changes
        run: python3 .github/scripts/classify_changes.py

      - name: Test CI routing
        if: steps.changes.outputs.ci == 'true'
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Validate workflows and release metadata
        if: steps.changes.outputs.ci == 'true'
        run: bash .github/scripts/check-workflows.sh

      - name: Set up Go
        if: steps.changes.outputs.heavy == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Verify formatting
        if: steps.changes.outputs.heavy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            printf 'The following files need gofmt:\n%s\n' "$unformatted"
            exit 1
          fi

      - name: Verify module metadata
        if: steps.changes.outputs.heavy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Verify ambiguous Go types are absent
        if: steps.changes.outputs.heavy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if rg -n '\bany\b|interface\{\}|map\[string\]any' --glob '*.go' .; then
            exit 1
          fi

      - name: Start PostgreSQL
        if: steps.changes.outputs.heavy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --rm \
            --name open-discogs-ci-postgres \
            --publish 5432:5432 \
            --env POSTGRES_USER=discogs \
            --env POSTGRES_PASSWORD=discogs \
            --env POSTGRES_DB=discogs \
            --tmpfs /var/lib/postgresql:rw,noexec,nosuid,size=1g \
            --health-cmd 'pg_isready --username discogs --dbname discogs' \
            --health-interval 1s \
            --health-timeout 5s \
            --health-retries 30 \
            postgres:18-alpine
          for _ in {1..30}; do
            if [[ "$(docker inspect --format '{{.State.Health.Status}}' open-discogs-ci-postgres)" == healthy ]]; then
              exit 0
            fi
            sleep 1
          done
          docker logs open-discogs-ci-postgres
          exit 1

      - name: Vet packages
        if: steps.changes.outputs.heavy == 'true'
        run: go vet ./...

      - name: Test with race detector and coverage
        if: steps.changes.outputs.heavy == 'true'
        run: go test -race -count=1 -coverpkg=./... -covermode=atomic -coverprofile=coverage.out ./...

      - name: Enforce 100% coverage
        if: steps.changes.outputs.heavy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          total="$(go tool cover -func=coverage.out | awk '/^total:/ {gsub("%", "", $3); print $3}')"
          awk -v total="$total" 'BEGIN {
            if (total + 0 != 100.0) {
              printf "coverage %.1f%% does not meet the 100%% gate\n", total
              exit 1
            }
            printf "coverage %.1f%% meets the 100%% gate\n", total
          }'

      - name: Scan known vulnerabilities
        if: steps.changes.outputs.heavy == 'true'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

      - name: Initialize CodeQL
        if: steps.changes.outputs.heavy == 'true'
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: go
          build-mode: manual

      - name: Build packages for CodeQL
        if: steps.changes.outputs.heavy == 'true'
        run: |
          go clean -cache
          go build ./...

      - name: Analyze with CodeQL
        if: steps.changes.outputs.heavy == 'true'
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:go

      - name: Validate Docker Compose
        if: steps.changes.outputs.heavy == 'true'
        env:
          API_DATABASE_URL: postgres://reader:secret@database:5432/discogs?sslmode=require
        run: docker compose config --quiet

      - name: Render Kubernetes manifests
        if: steps.changes.outputs.heavy == 'true'
        run: go run sigs.k8s.io/kustomize/kustomize/v5@v5.8.1 build deploy/kubernetes >/dev/null

      - name: Build container
        if: steps.changes.outputs.heavy == 'true'
        run: docker build --build-arg VERSION=ci -t go-open-discogs-api:ci .

      - name: Test container readiness
        if: steps.changes.outputs.heavy == 'true'
        run: scripts/test-container-readiness.sh go-open-discogs-api:ci

      - name: Stop PostgreSQL
        if: always() && steps.changes.outputs.heavy == 'true'
        run: docker rm --force open-discogs-ci-postgres >/dev/null 2>&1 || true
